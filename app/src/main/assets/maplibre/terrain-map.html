<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://stridecoach.local/assets/maplibre/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: __BG_HEX__; touch-action: none; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://stridecoach.local/assets/maplibre/maplibre-gl.js"></script>
<script>
(function() {
  function hasWebGL() {
    try {
      var c = document.createElement('canvas');
      return !!(window.WebGL2RenderingContext && c.getContext('webgl2')) || !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
    } catch (e) { return false; }
  }
  if (typeof maplibregl === 'undefined' || !hasWebGL()) {
    StrideBridge.onWebGlUnsupported();
    return;
  }

  window.__scPerf = { frames: 0, syncMsSum: 0, syncCount: 0, lastFrameMs: 0 };

  var state = {
    map: null,
    styleReady: false,
    activeStyle: '',
    lastStatic: null,
    lastFrame: null,
    lastCamMode: '',
    lastFitKey: '',
    lastFollowKey: '',
    lastFreeInit: false,
    lastHiTrig: -1,
    hiAnimTimer: null,
    lastExag: -1,
    lastInteractive: true,
    lastBuildingsVis: '',
    lastHillVis: '',
    lastHeadKey: '',
    lastUserDotKey: '',
    lastGuideKey: '',
    lastWpsKey: '',
    lastTrimKey: '',
    lastHiDataKey: '',
    lastBaseKey: '',
    stops: [],
    stopsKey: '',
    lastGradFrac: -1,
    lastGradMs: 0,
    lastGradMode: null,
    lastGradStopsKey: '',
    lastPaceOpacity: 1,
    cachedBase: [],
    cachedGuide: []
  };

  function emptyFc() { return { type: 'FeatureCollection', features: [] }; }
  function lineFc(coords) {
    if (!coords || coords.length < 2) return emptyFc();
    return { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: {} }] };
  }
  function pointFc(pt) {
    if (!pt) return emptyFc();
    return { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: pt }, properties: {} }] };
  }

  function invalidateTerrainRtt(map) {
    var tr = map && map.painter && map.painter.terrain;
    if (!tr || !tr.sourceCache || !tr.sourceCache.getRenderableTiles) return;
    var tiles = tr.sourceCache.getRenderableTiles();
    for (var i = 0; i < tiles.length; i++) tiles[i].rtt = [];
  }

  function reorganizeLayersForSinglePassTerrain(map) {
    var st = map.getStyle();
    var layers = st && st.layers;
    if (!layers) return;
    var syms = [];
    for (var i = 0; i < layers.length; i++) {
      var id = layers[i].id;
      if (layers[i].type === 'symbol') syms.push(id);
      else if (layers[i].type === 'fill-extrusion' && id !== '3d-buildings-layer') {
        map.setLayoutProperty(id, 'visibility', 'none');
      }
    }
    for (var j = 0; j < syms.length; j++) {
      if (map.getLayer(syms[j])) map.moveLayer(syms[j]);
    }
  }

  function findFirstSymbolId(map) {
    var st = map.getStyle();
    var layers = st && st.layers;
    if (!layers) return undefined;
    for (var i = 0; i < layers.length; i++) {
      if (layers[i].type === 'symbol') return layers[i].id;
    }
    return undefined;
  }

  function ensureTerrainAndLayers(map, p) {
    if (!map.getSource('terrain-dem')) {
      map.addSource('terrain-dem', {
        type: 'raster-dem',
        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        encoding: 'terrarium',
        tileSize: 256,
        maxzoom: 13
      });
    }
    var exag = (p && p.exag) ? p.exag : 2.2;
    try {
      map.setTerrain({ source: 'terrain-dem', exaggeration: exag });
      state.lastExag = exag;
    } catch (e) {
      StrideBridge.onWebGlUnsupported();
      return;
    }

    reorganizeLayersForSinglePassTerrain(map);
    var firstSym = findFirstSymbolId(map);
    var hsBefore = map.getLayer('building') ? 'building' : (map.getLayer('water_name') ? 'water_name' : firstSym);
    if (!map.getLayer('terrain-hillshade-layer')) {
      var hsDef = { id: 'terrain-hillshade-layer', type: 'hillshade', source: 'terrain-dem', paint: { 'hillshade-exaggeration': 0.34 } };
      if (hsBefore) map.addLayer(hsDef, hsBefore); else map.addLayer(hsDef);
    }

    installRouteLayersBefore(map, firstSym);

    if (map.getSource('openmaptiles') && !map.getLayer('3d-buildings-layer')) {
      var bldDef = {
        id: '3d-buildings-layer',
        type: 'fill-extrusion',
        source: 'openmaptiles',
        'source-layer': 'building',
        minzoom: 13.8,
        paint: {
          'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 12],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
          'fill-extrusion-color': '#3A4354',
          'fill-extrusion-opacity': 1.0
        }
      };
      if (firstSym) map.addLayer(bldDef, firstSym); else map.addLayer(bldDef);
    }

    installMarkerLayers(map);
  }

  function installRouteLayersBefore(map, beforeId) {
    var srcs = ['guide-src', 'base-src', 'trim-src', 'hi-src'];
    for (var i = 0; i < srcs.length; i++) {
      if (!map.getSource(srcs[i])) map.addSource(srcs[i], { type: 'geojson', data: emptyFc() });
    }
    if (!map.getSource('pace-src')) {
      map.addSource('pace-src', { type: 'geojson', lineMetrics: true, data: emptyFc() });
    }
    addLineLayerIfMissing(map, 'guide-layer', 'guide-src', { 'line-color': '#3DAEE9', 'line-width': 3.6, 'line-dasharray': [2.2, 1.8] }, beforeId);
    addLineLayerIfMissing(map, 'base-layer', 'base-src', { 'line-color': '#473C69', 'line-width': 4.0 }, beforeId);
    addLineLayerIfMissing(map, 'hi-layer', 'hi-src', { 'line-color': '#256F96', 'line-width': 10.5, 'line-opacity': 1.0, 'line-blur': 0.0 }, beforeId);
    addLineLayerIfMissing(map, 'pace-layer', 'pace-src', { 'line-color': '#926EE4', 'line-width': 5.4, 'line-opacity': 1.0 }, beforeId);
    addLineLayerIfMissing(map, 'trim-layer', 'trim-src', { 'line-color': '#F87171', 'line-width': 5.4 }, beforeId);
  }

  function installMarkerLayers(map) {
    var mSrcs = ['planner-pts-src', 'user-loc-src', 'head-src'];
    for (var i = 0; i < mSrcs.length; i++) {
      if (!map.getSource(mSrcs[i])) map.addSource(mSrcs[i], { type: 'geojson', data: emptyFc() });
    }
    if (!map.getLayer('planner-pts-layer')) {
      map.addLayer({
        id: 'planner-pts-layer', type: 'circle', source: 'planner-pts-src',
        paint: {
          'circle-radius': ['match', ['get', 'kind'], 'start', 8.5, 'end', 8.5, 6.0],
          'circle-color': ['match', ['get', 'kind'], 'start', '#4ADE80', 'end', '#F87171', '#926EE4'],
          'circle-stroke-color': '#FFFFFF',
          'circle-stroke-width': 2.2
        }
      });
    }
    if (!map.getLayer('user-loc-halo')) {
      map.addLayer({ id: 'user-loc-halo', type: 'circle', source: 'user-loc-src', paint: { 'circle-radius': 14, 'circle-color': '#3DAEE9', 'circle-opacity': 0.28 } });
      map.addLayer({ id: 'user-loc-ring', type: 'circle', source: 'user-loc-src', paint: { 'circle-radius': 7.8, 'circle-color': '#FFFFFF' } });
      map.addLayer({ id: 'user-loc-core', type: 'circle', source: 'user-loc-src', paint: { 'circle-radius': 5.2, 'circle-color': '#3DAEE9' } });
    }
    if (!map.getLayer('head-halo')) {
      map.addLayer({ id: 'head-halo', type: 'circle', source: 'head-src', paint: { 'circle-radius': 13, 'circle-color': '#926EE4', 'circle-opacity': 0.32 } });
      map.addLayer({ id: 'head-ring', type: 'circle', source: 'head-src', paint: { 'circle-radius': 7.5, 'circle-color': '#FFFFFF' } });
      map.addLayer({ id: 'head-core', type: 'circle', source: 'head-src', paint: { 'circle-radius': 4.8, 'circle-color': '#926EE4' } });
    }
  }

  function addLineLayerIfMissing(map, id, src, paint, beforeId) {
    if (map.getLayer(id)) return;
    var def = { id: id, type: 'line', source: src, layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: paint };
    if (beforeId) map.addLayer(def, beforeId); else map.addLayer(def);
  }

  function pulseHighlight(map, p) {
    if (!p.animateHi || !map.getLayer('hi-layer')) return;
    if (state.hiAnimTimer) clearInterval(state.hiAnimTimer);
    var startMs = Date.now();
    state.hiAnimTimer = setInterval(function() {
      if (!map.getLayer('hi-layer')) { clearInterval(state.hiAnimTimer); state.hiAnimTimer = null; return; }
      var dt = Date.now() - startMs;
      if (dt < 340) {
        var t = dt / 340.0;
        map.setPaintProperty('hi-layer', 'line-color', 'rgb(' + Math.round(37 + 88 * t) + ',' + Math.round(111 + 100 * t) + ',' + Math.round(150 + 102 * t) + ')');
        map.setPaintProperty('hi-layer', 'line-width', 10.5 + 3.0 * t);
      } else if (dt < 720) {
        map.setPaintProperty('hi-layer', 'line-color', '#7DD3FC');
        map.setPaintProperty('hi-layer', 'line-width', 13.5);
      } else if (dt < 1340) {
        var t2 = (dt - 720) / 620.0;
        map.setPaintProperty('hi-layer', 'line-color', 'rgb(' + Math.round(125 - 88 * t2) + ',' + Math.round(211 - 100 * t2) + ',' + Math.round(252 - 102 * t2) + ')');
        map.setPaintProperty('hi-layer', 'line-width', 13.5 - 3.0 * t2);
      } else {
        map.setPaintProperty('hi-layer', 'line-color', '#256F96');
        map.setPaintProperty('hi-layer', 'line-width', 10.5);
        clearInterval(state.hiAnimTimer);
        state.hiAnimTimer = null;
      }
      invalidateTerrainRtt(map);
    }, 45);
  }

  function computeFitCamera(bounds, w, h, padT, padB, padS, pitchDeg) {
    var minLon = bounds[0][0], minLat = bounds[0][1];
    var maxLon = bounds[1][0], maxLat = bounds[1][1];
    function mercX(lon) { return (lon + 180.0) / 360.0; }
    function mercY(lat) {
      var rad = Math.max(-85.0, Math.min(85.0, lat)) * Math.PI / 180.0;
      return (180.0 - (180.0 / Math.PI) * Math.log(Math.tan(Math.PI / 4.0 + rad / 2.0))) / 360.0;
    }
    function invMercY(y) {
      return (2.0 * Math.atan(Math.exp((180.0 - 360.0 * y) * Math.PI / 180.0)) - Math.PI / 2.0) * 180.0 / Math.PI;
    }
    var dx = Math.max(1e-6, mercX(maxLon) - mercX(minLon));
    var dy = Math.max(1e-6, mercY(minLat) - mercY(maxLat));
    var availW = Math.max(60, w - padS * 2);
    var availH = Math.max(60, h - padT - padB);
    var zoom = Math.max(1.0, Math.min(Math.log2(availW / (512.0 * dx)), Math.log2(availH / (512.0 * dy)), 16.0)) - (pitchDeg > 5 ? 0.35 : 0.0);
    return {
      center: [(minLon + maxLon) / 2.0, invMercY((mercY(minLat) + mercY(maxLat)) / 2.0)],
      zoom: zoom,
      pitch: pitchDeg,
      bearing: 0,
      padding: { top: padT, bottom: padB, left: padS, right: padS }
    };
  }

  function buildGradientExpr(stops, frac, colorByPace) {
    if (!colorByPace || !stops || stops.length === 0) {
      if (frac >= 0.999) return ['interpolate', ['linear'], ['line-progress'], 0, '#926EE4', 1, '#926EE4'];
      var cEnd = Math.min(0.9988, Math.max(0.002, frac));
      return ['interpolate', ['linear'], ['line-progress'], 0, '#926EE4', cEnd, '#926EE4', Math.min(1, cEnd + 0.0006), 'rgba(0,0,0,0)'];
    }
    var expr = ['interpolate', ['linear'], ['line-progress']];
    var tailCol = stops[0].c;
    if (frac >= 0.999) {
      for (var i = 0; i < stops.length; i++) {
        expr.push(stops[i].t, stops[i].c);
      }
      if (stops[stops.length - 1].t < 0.9999) expr.push(1.0, stops[stops.length - 1].c);
      return expr;
    }
    var fEnd = Math.min(0.9988, Math.max(0.002, frac));
    var prevT = -1;
    for (var k = 0; k < stops.length; k++) {
      var st = stops[k];
      if (st.t < fEnd - 0.0005) {
        if (st.t > prevT + 0.0001) {
          expr.push(st.t, st.c);
          prevT = st.t;
        }
        tailCol = st.c;
      } else {
        break;
      }
    }
    if (prevT < 0) expr.push(0.0, stops[0].c);
    expr.push(fEnd, tailCol);
    expr.push(Math.min(1.0, fEnd + 0.0006), 'rgba(0,0,0,0)');
    return expr;
  }

  function applyPaceGradient(map, frac, colorByPace, force) {
    if (!map.getLayer('pace-layer')) return;
    var isZero = frac <= 0.0005;
    if (isZero) {
      if (state.lastPaceOpacity !== 0) {
        state.lastPaceOpacity = 0;
        map.setPaintProperty('pace-layer', 'line-opacity', 0);
        invalidateTerrainRtt(map);
      }
      state.lastGradFrac = 0;
      state.lastGradMode = colorByPace;
      return;
    }
    if (state.lastPaceOpacity !== 1) {
      state.lastPaceOpacity = 1;
      map.setPaintProperty('pace-layer', 'line-opacity', 1);
    }
    var now = Date.now();
    var isFull = frac >= 0.999;
    var wasFull = state.lastGradFrac >= 0.999;
    var changedMode = colorByPace !== state.lastGradMode || state.stopsKey !== state.lastGradStopsKey;
    var endpointChanged = isFull !== wasFull || state.lastGradFrac <= 0.0005;
    if (!force && !changedMode && !endpointChanged) {
      if (now - state.lastGradMs < 55 || Math.abs(frac - state.lastGradFrac) < 0.0035) return;
    }
    state.lastGradFrac = frac;
    state.lastGradMs = now;
    state.lastGradMode = colorByPace;
    state.lastGradStopsKey = state.stopsKey;
    map.setPaintProperty('pace-layer', 'line-gradient', buildGradientExpr(state.stops, frac, colorByPace));
    invalidateTerrainRtt(map);
  }

  function syncStaticState(map, p) {
    if (Math.abs((p.exag || 2.2) - state.lastExag) > 0.05) {
      try { map.setTerrain({ source: 'terrain-dem', exaggeration: p.exag || 2.2 }); state.lastExag = p.exag || 2.2; } catch (e) {}
    }
    var hillVis = p.showHillshade ? 'visible' : 'none';
    if (hillVis !== state.lastHillVis && map.getLayer('terrain-hillshade-layer')) {
      state.lastHillVis = hillVis;
      map.setLayoutProperty('terrain-hillshade-layer', 'visibility', hillVis);
    }
    var bldVis = p.showBuildings ? 'visible' : 'none';
    if (bldVis !== state.lastBuildingsVis && map.getLayer('3d-buildings-layer')) {
      state.lastBuildingsVis = bldVis;
      map.setLayoutProperty('3d-buildings-layer', 'visibility', bldVis);
    }
    if (p.interactive !== state.lastInteractive) {
      state.lastInteractive = p.interactive;
      var hs = ['dragPan', 'scrollZoom', 'boxZoom', 'dragRotate', 'keyboard', 'doubleClickZoom', 'touchZoomRotate'];
      for (var k = 0; k < hs.length; k++) {
        if (map[hs[k]]) { if (p.interactive) map[hs[k]].enable(); else map[hs[k]].disable(); }
      }
    }

    var rttDirty = false;
    if (p.guide !== undefined) state.cachedGuide = p.guide;
    if ((p.guide !== undefined || state.lastGuideKey === '') && p.guideKey !== state.lastGuideKey && map.getSource('guide-src')) {
      state.lastGuideKey = p.guideKey || '';
      map.getSource('guide-src').setData(lineFc(state.cachedGuide));
      rttDirty = true;
    }
    if (p.base !== undefined) state.cachedBase = p.base;
    if ((p.base !== undefined || state.lastBaseKey === '') && p.baseKey !== state.lastBaseKey) {
      state.lastBaseKey = p.baseKey || '';
      var fc = lineFc(state.cachedBase);
      if (map.getSource('base-src')) map.getSource('base-src').setData(fc);
      if (map.getSource('pace-src')) map.getSource('pace-src').setData(fc);
      rttDirty = true;
    }
    if (p.paceStops !== undefined && p.stopsKey !== state.stopsKey) {
      state.stops = p.paceStops || [];
      state.stopsKey = p.stopsKey || '';
    }
    if (p.waypoints !== undefined && p.wpsKey !== state.lastWpsKey && map.getSource('planner-pts-src')) {
      state.lastWpsKey = p.wpsKey || '';
      var wf = (p.waypoints || []).map(function(w) {
        return { type: 'Feature', geometry: { type: 'Point', coordinates: [w.lon, w.lat] }, properties: { kind: w.kind } };
      });
      map.getSource('planner-pts-src').setData({ type: 'FeatureCollection', features: wf });
    }
    if (p.trim !== undefined && p.trimKey !== state.lastTrimKey && map.getSource('trim-src')) {
      state.lastTrimKey = p.trimKey || '';
      var tf = (p.trim || []).filter(function(c) { return c.length >= 2; }).map(function(c) {
        return { type: 'Feature', geometry: { type: 'LineString', coordinates: c }, properties: {} };
      });
      map.getSource('trim-src').setData({ type: 'FeatureCollection', features: tf });
      rttDirty = true;
    }
    if (p.hi !== undefined && p.hiDataKey !== state.lastHiDataKey && map.getSource('hi-src')) {
      state.lastHiDataKey = p.hiDataKey || '';
      map.getSource('hi-src').setData(lineFc(p.hi));
      rttDirty = true;
    }
    if (p.hi && p.hi.length >= 2 && p.hiTrigger !== state.lastHiTrig) {
      state.lastHiTrig = p.hiTrigger;
      var el = document.getElementById('map');
      if (p.hiBounds && el && el.clientWidth > 0 && el.clientHeight > 0) {
        var hTop = Math.min(Math.round(p.fitTopClearCss + 14), Math.round(el.clientHeight * 0.36));
        var hBot = Math.min(Math.round((p.hiBotCss || p.fitBotClearCss) + 20), Math.round(el.clientHeight * 0.38));
        var hSide = Math.min(Math.round(p.fitSideCss + 12), Math.round(el.clientWidth * 0.22));
        var hOpts = computeFitCamera(p.hiBounds, el.clientWidth, el.clientHeight, hTop, hBot, hSide, 46);
        hOpts.duration = 520;
        map.easeTo(hOpts);
      }
      pulseHighlight(map, p);
    }
    if (rttDirty) invalidateTerrainRtt(map);
    if (state.lastFrame) {
      applyPaceGradient(map, state.lastFrame.frac, state.lastFrame.colorByPace, true);
    }
  }

  function syncCamera(map, s, f) {
    var el = document.getElementById('map');
    if (!el || el.clientWidth <= 0 || el.clientHeight <= 0 || !f) return;
    var modeChanged = state.lastCamMode !== '' && state.lastCamMode !== f.camMode;
    var safeTop = Math.max(12, Math.round(f.fitTopClearCss));
    var safeBot = Math.max(12, Math.round(f.fitBotClearCss));
    var maxV = Math.max(40, Math.round(el.clientHeight * 0.62));
    if (safeTop + safeBot > maxV) {
      var sc = maxV / (safeTop + safeBot);
      safeTop = Math.max(12, Math.round(safeTop * sc));
      safeBot = Math.max(12, Math.round(safeBot * sc));
    }
    var safeSide = Math.min(Math.max(12, Math.round(f.fitSideCss)), Math.round(el.clientWidth * 0.22));
    var topPad = Math.min(Math.max(0, Math.round(f.topCss)), Math.round(el.clientHeight * 0.42));
    var botPad = Math.min(Math.max(0, Math.round(f.botCss)), Math.round(el.clientHeight * 0.44));

    if (f.camMode === 'FIT_ROUTE') {
      state.lastFollowKey = '';
      var fKey = s.bounds
        ? (s.ptsCount + '_' + s.geoHash + '_' + f.recenter + '_' + Math.round(safeTop / 12) + '_' + Math.round(safeBot / 12) + '_' + Math.round(el.clientWidth / 24) + '_' + Math.round(el.clientHeight / 24))
        : ('empty_' + (f.userLoc || s.fallback)[0].toFixed(5) + '_' + (f.userLoc || s.fallback)[1].toFixed(5) + '_' + f.recenter);
      if (fKey !== state.lastFitKey || modeChanged) {
        state.lastFitKey = fKey;
        map.stop();
        map.jumpTo(s.bounds
          ? computeFitCamera(s.bounds, el.clientWidth, el.clientHeight, safeTop, safeBot, safeSide, 48)
          : { center: f.userLoc || s.fallback, zoom: 15.6, pitch: 48, bearing: 0, padding: { top: topPad, bottom: botPad, left: 0, right: 0 } });
      }
    } else if (f.camMode === 'FOLLOW_RUNNER') {
      state.lastFitKey = '';
      var tgt = f.head || s.routeEnd || f.userLoc || s.routeStart || s.fallback;
      var flwKey = tgt[0].toFixed(6) + '_' + tgt[1].toFixed(6) + '_' + f.recenter + '_' + Math.round(topPad / 12) + '_' + Math.round(botPad / 12) + '_' + Math.round(f.liveHeading || 0) + '_' + Math.round(el.clientWidth / 24);
      if (flwKey !== state.lastFollowKey || modeChanged) {
        var first = state.lastFollowKey === '';
        state.lastFollowKey = flwKey;
        var opts = { center: tgt, zoom: (first || modeChanged || map.getZoom() < 15.6) ? 16.4 : map.getZoom(), pitch: 56, bearing: f.liveHeading || 0, padding: { top: topPad, bottom: botPad, left: 0, right: 0 } };
        if (first || (!modeChanged && f.showHead)) map.jumpTo(opts); else { opts.duration = 340; map.easeTo(opts); }
      }
    } else {
      state.lastFitKey = '';
      state.lastFollowKey = '';
      if (!state.lastFreeInit) {
        state.lastFreeInit = true;
        map.jumpTo({ center: f.userLoc || s.routeStart || s.fallback, zoom: 15.6, pitch: 48, bearing: 0, padding: { top: topPad, bottom: botPad, left: 0, right: 0 } });
      }
    }
    state.lastCamMode = f.camMode;
  }

  function syncFrameState(map, f) {
    var uk = f.showUserDot && f.userLoc ? (f.userLoc[0].toFixed(6) + ',' + f.userLoc[1].toFixed(6)) : 'off';
    if (uk !== state.lastUserDotKey && map.getSource('user-loc-src')) {
      state.lastUserDotKey = uk;
      map.getSource('user-loc-src').setData(f.showUserDot ? pointFc(f.userLoc) : emptyFc());
    }
    var hk = f.showHead && f.head ? (f.head[0].toFixed(6) + ',' + f.head[1].toFixed(6)) : 'off';
    if (hk !== state.lastHeadKey && map.getSource('head-src')) {
      state.lastHeadKey = hk;
      map.getSource('head-src').setData(f.showHead ? pointFc(f.head) : emptyFc());
    }
    applyPaceGradient(map, f.frac, !!f.colorByPace, false);
    if (state.lastStatic) syncCamera(map, state.lastStatic, f);
  }

  function initOrSwapMap(s) {
    if (!state.map) {
      state.activeStyle = s.styleUri;
      var f = state.lastFrame || {};
      var map = new maplibregl.Map({
        container: 'map',
        style: s.styleUri,
        center: f.head || s.routeStart || f.userLoc || s.fallback,
        zoom: 15.2,
        pitch: 48,
        attributionControl: false,
        antialias: false,
        fadeDuration: 0,
        maxTileCacheSize: 48,
        refreshExpiredTiles: false,
        pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
      });
      state.map = map;
      map.on('error', function(ev) { if (ev && ev.error && /webgl/i.test(String(ev.error))) StrideBridge.onWebGlUnsupported(); });
      map.on('webglcontextlost', function() { StrideBridge.onWebGlUnsupported(); });
      var firePan = function(e) { if (e && e.originalEvent) StrideBridge.onUserPan(); };
      map.on('dragstart', firePan);
      map.on('zoomstart', firePan);
      map.on('rotatestart', firePan);
      map.on('pitchstart', firePan);
      map.on('click', function(e) { if (e && e.lngLat) StrideBridge.onMapTap(e.lngLat.lat, e.lngLat.lng); });
      map.on('resize', function() { if (state.lastStatic && state.lastFrame) syncCamera(map, state.lastStatic, state.lastFrame); });
      map.on('render', function() { window.__scPerf.frames++; window.__scPerf.lastFrameMs = Date.now(); });
      map.on('style.load', function() {
        state.styleReady = true;
        resetCachedKeys();
        var cur = state.lastStatic || s;
        ensureTerrainAndLayers(map, cur);
        syncStaticState(map, cur);
        if (state.lastFrame) syncFrameState(map, state.lastFrame);
      });
    } else if (state.activeStyle !== s.styleUri) {
      state.activeStyle = s.styleUri;
      state.styleReady = false;
      resetCachedKeys();
      state.map.setStyle(s.styleUri);
    }
  }

  function resetCachedKeys() {
    state.lastGuideKey = ''; state.lastBaseKey = ''; state.lastWpsKey = '';
    state.lastTrimKey = ''; state.lastHiDataKey = ''; state.lastHeadKey = '';
    state.lastUserDotKey = ''; state.lastBuildingsVis = ''; state.lastHillVis = '';
    state.lastGradMode = null; state.lastGradFrac = -1; state.lastPaceOpacity = -1;
  }

  window.__scSyncStatic = function(jsonStr) {
    try {
      var t0 = performance.now();
      var s = JSON.parse(jsonStr);
      state.lastStatic = s;
      initOrSwapMap(s);
      if (state.styleReady && state.map) syncStaticState(state.map, s);
      window.__scPerf.syncMsSum += performance.now() - t0;
      window.__scPerf.syncCount++;
    } catch (e) {}
  };

  window.__scSyncFrame = function(jsonStr) {
    try {
      var t0 = performance.now();
      var f = JSON.parse(jsonStr);
      state.lastFrame = f;
      if (state.styleReady && state.map) syncFrameState(state.map, f);
      window.__scPerf.syncMsSum += performance.now() - t0;
      window.__scPerf.syncCount++;
    } catch (e) {}
  };

  (function bootstrapRtlAndReady() {
    function done() { StrideBridge.onMapReady(); }
    try {
      if (maplibregl.getRTLTextPluginStatus && maplibregl.getRTLTextPluginStatus() === 'unavailable') {
        fetch('https://stridecoach.local/assets/maplibre/mapbox-gl-rtl-text.js')
          .then(function(r) { return r.text(); })
          .then(function(code) {
            var blobUrl = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
            maplibregl.setRTLTextPlugin(blobUrl, false);
            done();
          })
          .catch(done);
        return;
      }
    } catch (e) {}
    done();
  })();
})();
</script>
