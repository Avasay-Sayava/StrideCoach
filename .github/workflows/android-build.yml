name: Android CI & APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :core:domain:test :core:data:testDebugUnitTest :core:tracking:testDebugUnitTest :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk StrideCoach-latest.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stridecoach-debug-apk
          path: StrideCoach-latest.apk

      - name: Publish Rolling GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest StrideCoach-latest.apk --clobber
          else
            gh release create latest StrideCoach-latest.apk --title "StrideCoach Latest APK" --notes "Direct installable Android APK for Samsung and Android devices."
          fi
